# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify public website artifact
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re, hashlib, base64
          page = Path('site/index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>(.*?)</script>', page, re.S).group(1)
          digest = base64.b64encode(hashlib.sha256(script.encode()).digest()).decode()
          assert 'sha256-' + digest in page, 'Inline JavaScript CSP hash mismatch'
          for file in Path('site').rglob('*'):
              if file.is_file():
                  content = file.read_text(encoding='utf-8')
                  assert not re.search(r'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}', content), 'Credential-shaped value found in public artifact'
          assert Path('site/config.js').exists()
          print('Website path, CSP and public credential checks passed.')
          PYTHON
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy the website folder only; the root URL must serve index.html.
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
